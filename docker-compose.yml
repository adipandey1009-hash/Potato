version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: potato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-potato_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potato_secure_password_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - potato_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-potato_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - potato-network

  redis:
    image: redis:7-alpine
    container_name: potato-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - potato_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - potato-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: potato-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-potato_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-potato_secure_password_123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-4c653066613337626130386134376435386237613563636531326462613963383832393366623631623832353361366166303233383437346663363435343461}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - potato-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: potato-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-potato_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-potato_secure_password_123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-4c653066613337626130386134376435386237613563636531326462613963383832393366623631623832353361366166303233383437346663363435343461}
    networks:
      - potato-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: potato-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - potato-network

volumes:
  potato_pgdata:
  potato_redisdata:

networks:
  potato-network:
    driver: bridge

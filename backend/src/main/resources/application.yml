server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: potato-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/potato_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

potato:
  security:
    jwt:
      secret: ${JWT_SECRET:4c653066613337626130386134376435386237613563636531326462613963383832393366623631623832353361366166303233383437346663363435343461}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  queue:
    worker-poll-rate-ms: 3000
    outbox-poll-rate-ms: 2000
  finance:
    tax-rate: 0.0825 # 8.25%
  seed:
    enabled: true
    admin-email: admin@potato.local
    admin-password: PotatoAdmin123!
    kitchen-email: kitchen@potato.local
    kitchen-password: PotatoKitchen123!
    customer-email: customer@potato.local
    customer-password: PotatoDemo123!

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
